<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Mission Control</title>
  <meta name="description" content="Daniel Freed's colorful office view — watch which bots are working and on what." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;700;800&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet" />
  <style>
:root {
  --bg: #1a1040;
  --card: #26165a;
  --ink: #1a1040;
  --paper: #fff8e7;
  --accent: #ff6b9d;
  --teal: #00c2a8;
  --purple: #7c5cff;
  --gold: #ffb020;
  --safe-top: env(safe-area-inset-top, 0px);
  --safe-bottom: env(safe-area-inset-bottom, 0px);
}

* { box-sizing: border-box; margin: 0; padding: 0; }

html, body {
  height: 100%;
  background: radial-gradient(120% 80% at 50% 0%, #3a1f7a 0%, var(--bg) 55%, #0d0824 100%);
  color: var(--paper);
  font-family: "Nunito", system-ui, sans-serif;
  -webkit-font-smoothing: antialiased;
}

.app {
  max-width: 480px;
  margin: 0 auto;
  min-height: 100dvh;
  padding: calc(10px + var(--safe-top)) 14px calc(16px + var(--safe-bottom));
  display: flex;
  flex-direction: column;
  gap: 10px;
}

.topbar {
  display: flex;
  align-items: center;
  gap: 10px;
}

.logo-mark {
  width: 42px;
  height: 42px;
  border-radius: 14px;
  background: linear-gradient(135deg, var(--accent), var(--gold));
  display: grid;
  place-items: center;
  font-size: 22px;
  box-shadow: 0 6px 18px rgba(255, 107, 157, 0.35);
}

h1 {
  font-family: "Space Grotesk", sans-serif;
  font-size: 1.25rem;
  font-weight: 700;
  letter-spacing: -0.02em;
  line-height: 1.1;
}

.tagline {
  font-size: 0.72rem;
  opacity: 0.75;
  font-weight: 600;
}

.pulse {
  margin-left: auto;
  font-size: 0.65rem;
  font-weight: 700;
  padding: 6px 10px;
  border-radius: 999px;
  background: rgba(255,255,255,0.12);
  white-space: nowrap;
}

.office-panel {
  /* Top half of a phone screen — no scroll needed to see the office */
  flex: 0 0 auto;
  height: min(46dvh, 280px);
  border-radius: 20px;
  overflow: hidden;
  box-shadow: 0 12px 40px rgba(0,0,0,0.35);
  border: 2px solid rgba(255,255,255,0.18);
}

.office-svg {
  width: 100%;
  height: 100%;
  display: block;
}

.projects-panel {
  flex: 1 1 auto;
  background: rgba(255,255,255,0.08);
  border: 1px solid rgba(255,255,255,0.14);
  border-radius: 18px;
  padding: 12px 14px 14px;
  backdrop-filter: blur(8px);
}

.projects-panel h2 {
  font-family: "Space Grotesk", sans-serif;
  font-size: 0.95rem;
  margin-bottom: 10px;
  letter-spacing: -0.01em;
}

.project-list {
  display: flex;
  flex-direction: column;
  gap: 8px;
}

.project-card {
  display: grid;
  grid-template-columns: 10px 1fr;
  gap: 10px;
  align-items: start;
  background: var(--paper);
  color: var(--ink);
  border-radius: 14px;
  padding: 10px 12px;
  box-shadow: 0 4px 14px rgba(0,0,0,0.12);
}

.project-card .stripe {
  width: 10px;
  border-radius: 8px;
  align-self: stretch;
  min-height: 36px;
}

.project-card h3 {
  font-family: "Space Grotesk", sans-serif;
  font-size: 0.95rem;
  font-weight: 700;
  margin-bottom: 2px;
}

.project-card p {
  font-size: 0.75rem;
  opacity: 0.8;
  line-height: 1.35;
}

.project-card a {
  display: inline-block;
  margin-top: 6px;
  font-size: 0.72rem;
  font-weight: 800;
  color: #5b3fd4;
  text-decoration: none;
  word-break: break-all;
}

.project-card a:hover { text-decoration: underline; }

.working-pill {
  display: inline-block;
  margin-top: 4px;
  font-size: 0.65rem;
  font-weight: 800;
  color: #0d6b5c;
  background: #d6fff6;
  padding: 2px 8px;
  border-radius: 999px;
}

@media (max-height: 700px) {
  .office-panel { height: min(42dvh, 240px); }
  h1 { font-size: 1.1rem; }
}

@media (min-width: 520px) {
  .app { padding-top: 18px; }
}

</style>
</head>
<body>
  <div class="app">
    <header class="topbar">
      <div class="logo-mark" aria-hidden="true">🛸</div>
      <div>
        <h1>Mission Control</h1>
        <p class="tagline">Office view · who’s working · on what</p>
      </div>
      <div class="pulse" id="updatedLabel">Loading…</div>
    </header>

    <section class="office-panel" aria-label="Office floor">
      <svg class="office-svg" viewBox="0 0 400 220" role="img" aria-label="Illustrated office with desks and robots">
        <defs>
          <linearGradient id="floorGrad" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%" stop-color="#FFE8A3"/>
            <stop offset="100%" stop-color="#FFD36A"/>
          </linearGradient>
          <linearGradient id="wallGrad" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0%" stop-color="#7C5CFF"/>
            <stop offset="55%" stop-color="#5B8CFF"/>
            <stop offset="100%" stop-color="#00C2A8"/>
          </linearGradient>
          <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
            <feDropShadow dx="0" dy="3" stdDeviation="2.5" flood-opacity="0.25"/>
          </filter>
        </defs>

        <!-- Room -->
        <rect x="0" y="0" width="400" height="220" rx="18" fill="url(#wallGrad)"/>
        <rect x="12" y="48" width="376" height="160" rx="14" fill="url(#floorGrad)"/>
        <!-- Window -->
        <rect x="28" y="12" width="70" height="28" rx="6" fill="#B8E8FF" opacity="0.9"/>
        <rect x="106" y="12" width="70" height="28" rx="6" fill="#B8E8FF" opacity="0.75"/>
        <text x="200" y="32" text-anchor="middle" font-family="Nunito, sans-serif" font-size="14" font-weight="800" fill="#fff">🏠 The Office</text>
        <!-- Plant -->
        <ellipse cx="360" cy="175" rx="14" ry="8" fill="#2E8B57"/>
        <rect x="356" y="175" width="8" height="18" rx="2" fill="#8B5A2B"/>
        <circle cx="360" cy="162" r="12" fill="#3CB371"/>
        <circle cx="350" cy="168" r="8" fill="#2E8B57"/>
        <circle cx="370" cy="168" r="8" fill="#2E8B57"/>
        <!-- Rug -->
        <ellipse cx="200" cy="175" rx="70" ry="18" fill="#FF6B9D" opacity="0.35"/>

        <g id="desksGroup"></g>
        <g id="bubblesGroup"></g>
      </svg>
    </section>

    <section class="projects-panel" aria-label="Grok projects">
      <h2>Grok projects</h2>
      <div class="project-list" id="projectList"></div>
    </section>
  </div>
  <script>
(function () {
  const DESK_LAYOUT = [
    { x: 36, y: 78 },
    { x: 128, y: 78 },
    { x: 220, y: 78 },
    { x: 312, y: 78 }
  ];

  function esc(s) {
    return String(s == null ? "" : s)
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;");
  }

  function wrapText(text, maxChars) {
    const words = String(text).split(/\s+/);
    const lines = [];
    let line = "";
    for (const w of words) {
      const next = line ? line + " " + w : w;
      if (next.length > maxChars && line) {
        lines.push(line);
        line = w;
      } else {
        line = next;
      }
    }
    if (line) lines.push(line);
    return lines.slice(0, 2);
  }

  function deskSvg(desk, i) {
    const pos = DESK_LAYOUT[i] || { x: 36 + i * 92, y: 78 };
    const color = desk.color || "#7C5CFF";
    const bot = desk.bot;
    let robot = "";
    if (bot) {
      robot = `
        <g transform="translate(${pos.x + 18}, ${pos.y - 28})" filter="url(#softShadow)">
          <ellipse cx="18" cy="42" rx="14" ry="5" fill="rgba(0,0,0,0.15)"/>
          <rect x="6" y="14" width="24" height="22" rx="8" fill="#fff"/>
          <rect x="6" y="14" width="24" height="22" rx="8" fill="${esc(color)}" opacity="0.85"/>
          <circle cx="18" cy="8" r="11" fill="#fff"/>
          <circle cx="18" cy="8" r="11" fill="${esc(color)}" opacity="0.9"/>
          <circle cx="14" cy="7" r="2.2" fill="#1a1040"/>
          <circle cx="22" cy="7" r="2.2" fill="#1a1040"/>
          <path d="M13 12 Q18 15 23 12" stroke="#1a1040" stroke-width="1.5" fill="none" stroke-linecap="round"/>
          <rect x="2" y="18" width="5" height="10" rx="2" fill="#FFE08A"/>
          <rect x="29" y="18" width="5" height="10" rx="2" fill="#FFE08A"/>
          <text x="18" y="56" text-anchor="middle" font-family="Nunito,sans-serif" font-size="8" font-weight="800" fill="#1a1040">${esc(bot.name)}</text>
        </g>`;
    } else {
      robot = `
        <g transform="translate(${pos.x + 10}, ${pos.y + 8})" opacity="0.55">
          <text x="26" y="8" text-anchor="middle" font-family="Nunito,sans-serif" font-size="8" font-weight="700" fill="#8a6b20">empty</text>
        </g>`;
    }

    return `
      <g>
        <!-- desk -->
        <rect x="${pos.x}" y="${pos.y + 22}" width="72" height="10" rx="3" fill="#8B5A2B" filter="url(#softShadow)"/>
        <rect x="${pos.x + 4}" y="${pos.y + 12}" width="64" height="14" rx="4" fill="#C48A4A"/>
        <rect x="${pos.x + 8}" y="${pos.y + 32}" width="6" height="18" rx="2" fill="#6E4320"/>
        <rect x="${pos.x + 58}" y="${pos.y + 32}" width="6" height="18" rx="2" fill="#6E4320"/>
        <!-- monitor -->
        <rect x="${pos.x + 22}" y="${pos.y - 2}" width="28" height="18" rx="3" fill="#2a2a4a"/>
        <rect x="${pos.x + 24}" y="${pos.y}" width="24" height="12" rx="2" fill="#7CF5E0"/>
        <rect x="${pos.x + 33}" y="${pos.y + 16}" width="6" height="6" fill="#444"/>
        ${robot}
      </g>`;
  }

  function bubblesSvg(chatter) {
    if (!chatter || !chatter.length) return "";
    const slots = [
      { x: 40, y: 52 },
      { x: 210, y: 52 }
    ];
    return chatter.slice(0, 2).map((c, i) => {
      const slot = slots[i] || { x: 40 + i * 170, y: 52 };
      const label = `${c.from} → ${c.to}`;
      const lines = wrapText(c.text, 28);
      const h = 18 + lines.length * 10;
      const w = 150;
      const textLines = lines
        .map((ln, li) => `<tspan x="${slot.x + 8}" dy="${li === 0 ? 0 : 10}">${esc(ln)}</tspan>`)
        .join("");
      return `
        <g filter="url(#softShadow)">
          <rect x="${slot.x}" y="${slot.y}" width="${w}" height="${h}" rx="10" fill="#fff"/>
          <polygon points="${slot.x + 24},${slot.y + h} ${slot.x + 34},${slot.y + h} ${slot.x + 28},${slot.y + h + 8}" fill="#fff"/>
          <text x="${slot.x + 8}" y="${slot.y + 12}" font-family="Nunito,sans-serif" font-size="7.5" font-weight="800" fill="#7C5CFF">${esc(label)}</text>
          <text y="${slot.y + 24}" font-family="Nunito,sans-serif" font-size="8" font-weight="600" fill="#1a1040">${textLines}</text>
        </g>`;
    }).join("");
  }

  function renderProjects(projects, desks) {
    const workingByProject = {};
    (desks || []).forEach((d) => {
      if (d.bot && d.bot.project) {
        workingByProject[d.bot.project] = d.bot;
      }
    });
    const colors = ["#FF6B9D", "#7C5CFF", "#00C2A8"];
    const el = document.getElementById("projectList");
    el.innerHTML = (projects || [])
      .map((p, i) => {
        const bot = workingByProject[p.name];
        const link =
          p.productLink
            ? `<a href="${esc(p.productLink)}" target="_blank" rel="noopener noreferrer">${esc(p.productLink)}</a>`
            : "";
        const pill = bot
          ? `<span class="working-pill">${esc(bot.name)} · ${esc(bot.task)} · since ${esc(bot.sinceLabel || "")}</span>`
          : "";
        return `
          <article class="project-card">
            <div class="stripe" style="background:${colors[i % colors.length]}"></div>
            <div>
              <h3>${esc(p.name)}</h3>
              <p>${esc(p.blurb || "")}</p>
              ${pill}
              ${link}
            </div>
          </article>`;
      })
      .join("");
  }

  function render(data) {
    const desksGroup = document.getElementById("desksGroup");
    const bubblesGroup = document.getElementById("bubblesGroup");
    desksGroup.innerHTML = (data.desks || []).map(deskSvg).join("");
    bubblesGroup.innerHTML = bubblesSvg(data.chatter || []);
    renderProjects(data.projects || [], data.desks || []);

    const updated = document.getElementById("updatedLabel");
    if (data.updatedAt) {
      try {
        const d = new Date(data.updatedAt);
        updated.textContent =
          "Updated " +
          d.toLocaleTimeString("en-US", {
            timeZone: data.timezone || "America/Chicago",
            hour: "numeric",
            minute: "2-digit"
          }) +
          " CT";
      } catch (_) {
        updated.textContent = "Live";
      }
    } else {
      updated.textContent = "Live";
    }
  }

  Promise.resolve({
  "updatedAt": "2026-10-31T09:45:00-05:00",
  "timezone": "America/Chicago",
  "officeTitle": "Mission Control",
  "desks": [
    {
      "id": "desk-1",
      "label": "Desk 1",
      "color": "#FF6B9D",
      "bot": {
        "name": "Product",
        "emoji": "🤖",
        "status": "working",
        "project": "Agent World",
        "task": "Speed up the slow first load",
        "since": "2026-10-31T09:40:00-05:00",
        "sinceLabel": "9:40 AM CT"
      }
    },
    {
      "id": "desk-2",
      "label": "Desk 2",
      "color": "#7C5CFF",
      "bot": null
    },
    {
      "id": "desk-3",
      "label": "Desk 3",
      "color": "#00C2A8",
      "bot": null
    },
    {
      "id": "desk-4",
      "label": "Desk 4",
      "color": "#FFB020",
      "bot": null
    }
  ],
  "chatter": [
    {
      "from": "Chief",
      "to": "Product",
      "text": "Let's lock the code decision and keep moving on first-load speed.",
      "at": "2026-10-31T09:42:00-05:00"
    },
    {
      "from": "The Contrarian",
      "to": "everyone",
      "text": "Darren is a silent partner. The code is ours.",
      "at": "2026-10-31T09:43:00-05:00"
    }
  ],
  "projects": [
    {
      "id": "agent-world",
      "name": "Agent World",
      "blurb": "3D agent world product (Claude Edition merge).",
      "productLink": "https://ce2-h7w3n9x5kq2m.vercel.app/"
    },
    {
      "id": "show-buddies",
      "name": "Show Buddies",
      "blurb": "Jam-band buddy matching and tour social layer.",
      "productLink": null
    },
    {
      "id": "mission-control",
      "name": "Mission Control",
      "blurb": "Office view and project folders on grok.com.",
      "productLink": null
    }
  ]
}).then(render)
    .catch((err) => {
      document.getElementById("updatedLabel").textContent = "Offline";
      console.error(err);
    });
})();

</script>
</body>
</html>
